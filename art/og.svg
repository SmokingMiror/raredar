    <path d="M-45,-4.5 Q-65,-6 -80,0 Q-65,6 -45,4.5 Z" fill="url(#flame)"/>
    <path d="M-45,-2.5 Q-60,-2.5 -70,0 Q-60,2.5 -45,2.5 Z" fill="#e9f4ff"/>
    <path d="M8,1 L-24,2 L-30,6 L-4,4 Z" fill="#d5dde8" stroke="#0b111c" stroke-width="1.2" opacity="0.7"/>
    <path d="M-24,-5 L-37,-22 L-30,-22.5 L-12,-5.5 Z" fill="#d5dde8" stroke="#0b111c" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-31,-14 L-35.5,-20.5 L-31.5,-20.8 L-26,-14 Z" fill="#3b82c4"/>
    <path d="M46,0 C34,-3.5 18,-7 0,-7 L-34,-6 L-42,-4.5 L-45,-4.5 L-45,4.5 L-42,4.5 L-34,6 L0,6 C18,6 34,3 46,0 Z" fill="#d5dde8" stroke="#0b111c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M36,0.6 C26,1.6 14,2.6 0,2.6 L-38,2.6 L-38,0.6 L0,0.6 C14,0.6 26,0.2 36,0.6 Z" fill="#3b82c4"/>
