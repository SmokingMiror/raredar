    <path d="M12,3 L-20,4.5 L-30,12 L-26,12.5 L-2,7 Z" fill="#d5dde8" stroke="#0b111c" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-30,2.5 L-44,8 L-39,8.5 L-26,4 Z" fill="#d5dde8" stroke="#0b111c" stroke-width="1.2"/>
    <rect x="-48" y="-4" width="4" height="8" rx="1" fill="#3a4252" stroke="#0b111c" stroke-width="1.2"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(70,250) skewX(-10)">
    <text x="0" y="0" font-family="Avenir Next Condensed, Futura, Helvetica Neue, sans-serif" font-weight="800" font-style="italic" font-size="150" fill="#6cff8f" filter="url(#glow)" opacity="0.7" letter-spacing="6">MACH 7</text>
    <text x="0" y="0" font-family="Avenir Next Condensed, Futura, Helvetica Neue, sans-serif" font-weight="800" font-style="italic" font-size="150" fill="#ffffff" letter-spacing="6">MACH 7</text>
  </g>
  <text x="76" y="320" font-family="Menlo, monospace" font-size="34" fill="#6cff8f" letter-spacing="4">RARE ANSWERS FLY HIGHER.</text>
  <text x="76" y="372" font-family="Helvetica Neue, sans-serif" font-size="26" fill="#cfd9ea">7 prompts · 25 seconds · how high can you get?</text>
  <!-- HUD corner brackets -->
  <path d="M30,60 L30,30 L60,30 M1140,30 L1170,30 L1170,60 M30,570 L30,600 L60,600 M1170,570 L1170,600 L1140,600" fill="none" stroke="#6cff8f" stroke-width="3" opacity="0.8"/>
