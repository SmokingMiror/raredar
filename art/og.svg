<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060d"/><stop offset="0.45" stop-color="#1b1f4a"/><stop offset="0.8" stop-color="#3b82c4"/><stop offset="1" stop-color="#d98a5a"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9ff"/><stop offset="1" stop-color="#2d6fa8"/></linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#4fb6ff"/><stop offset="0.35" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="90" cy="60" r="2"/><circle cx="260" cy="120" r="1.5"/><circle cx="420" cy="40" r="2.2"/><circle cx="610" cy="90" r="1.4"/>
    <circle cx="760" cy="30" r="1.8"/><circle cx="980" cy="70" r="1.5"/><circle cx="1120" cy="140" r="2"/><circle cx="1040" cy="22" r="1.3"/>
    <circle cx="180" cy="200" r="1.2"/><circle cx="880" cy="170" r="1.2"/>
  </g>
  <g fill="#fff" opacity="0.85">
